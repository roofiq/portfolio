name: Portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        env:
          HUGO_VERSION: "0.147.9"
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build site
        run: hugo --minify --cleanDestinationDir
      - name: Check generated site
        run: python3 scripts/check-site.py public
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: public/
          if-no-files-found: error
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [infra, bootstrap/platform]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: portfolio-infra-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-site
          path: public
      - name: Reject stale infrastructure runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_SHA" != "$current_sha" ]; then
            echo "::error::This run is no longer current on main. Run the workflow on the latest main commit."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"
      - name: Check bootstrap configuration
        env:
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          test -n "$ARM_CLIENT_ID"
          test -n "$ARM_TENANT_ID"
          test -n "$ARM_SUBSCRIPTION_ID"
          test -n "$TF_STATE_STORAGE_ACCOUNT"
      - name: Initialize remote state
        env:
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: terraform init -input=false -lockfile=readonly -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
      - name: Plan
        run: terraform plan -input=false -no-color -out=portfolio.tfplan
      - name: Apply
        run: terraform apply -input=false -no-color portfolio.tfplan
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get deployment token
        id: deployment-token
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list --name swa-portfolio-prod --resource-group rg-portfolio-prod --query properties.apiKey --output tsv)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Azure did not return a Static Web Apps deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Reject stale site deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_SHA" != "$current_sha" ]; then
            echo "::error::Main changed during this run. The latest run will publish the site."
            exit 1
          fi
      - name: Deploy portfolio
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.token }}
          action: upload
          app_location: public
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Show site URL
        run: |
          url=$(terraform output -raw static_web_app_url)
          echo "Portfolio deployed: $url"
          echo "### Portfolio deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"
